name: Build Android APK & Release Bundle

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-android:
    name: Build APK and AAB
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend-react/package-lock.json

      - name: Build Web Bundle & Sync Android Assets
        run: |
          cd frontend-react
          npm ci
          npm run build
          npx cap sync android

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x frontend-react/android/gradlew

      - name: Build Android Debug APK
        run: |
          cd frontend-react/android
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK for Easy Distribution
        run: |
          mkdir -p release-output
          cp frontend-react/android/app/build/outputs/apk/debug/app-debug.apk release-output/RiceCare-AI-v2.0.0.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RiceCare-AI-v2.0.0-APK
          path: release-output/RiceCare-AI-v2.0.0.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v2.0.0
          name: "RiceCare AI v2.0.0 — Android APK Release"
          files: release-output/RiceCare-AI-v2.0.0.apk
          draft: false
          prerelease: false
          body: |
            ## 🌾 RiceCare AI — Android Application Release (v2.0.0)

            Direct installation package for Android smartphones and tablets.

            ### 📥 Download Link
            Download **`RiceCare-AI-v2.0.0.apk`** from the Assets below and tap to install on your Android device.

            ### 📋 What's Included:
            - **Live Camera & Gallery Diagnosis:** Capture leaf photos in paddy fields or upload from gallery.
            - **20 Rice Conditions:** Powered by PyTorch Hybrid CNN + Quantum VQC.
            - **Lesion Severity & Symptoms:** Automatic tissue area calculation and cultural care advice.
            - **Offline Tolerant:** Reconnects seamlessly to your cloud backend.
