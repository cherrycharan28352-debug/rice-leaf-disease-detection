name: Build Android APK & Release Bundle

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-android:
    name: Build APK and AAB
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend-react/package-lock.json

      - name: Build Web Bundle & Sync Android Assets
        run: |
          cd frontend-react
          npm ci
          npm run build
          npx cap sync android

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x frontend-react/android/gradlew

      - name: Build Android Direct APK & Google Play AAB Bundle
        run: |
          cd frontend-react/android
          ./gradlew assembleDebug bundleDebug --no-daemon

      - name: Stage Artifacts for Distribution
        run: |
          mkdir -p release-output
          cp frontend-react/android/app/build/outputs/apk/debug/app-debug.apk release-output/RiceCare-AI-v2.0.0.apk
          cp frontend-react/android/app/build/outputs/bundle/debug/app-debug.aab release-output/RiceCare-AI-v2.0.0.aab

      - name: Upload APK and AAB Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RiceCare-AI-v2.0.0-Android-Packages
          path: |
            release-output/RiceCare-AI-v2.0.0.apk
            release-output/RiceCare-AI-v2.0.0.aab
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v2.0.0
          name: "RiceCare AI v2.0.0 — Android APK & Play Store AAB Bundle"
          files: |
            release-output/RiceCare-AI-v2.0.0.apk
            release-output/RiceCare-AI-v2.0.0.aab
          draft: false
          prerelease: false
          body: |
            ## 🌾 RiceCare AI — ಭತ್ತದ ರೋಗ ಪತ್ತೆ (v2.0.0)

            Complete production release for Android smartphones and tablets.

            ### 📦 Packages Included:
            1. **`RiceCare-AI-v2.0.0.apk`**: Direct installation package for testing and sideloading on any Android device.
            2. **`RiceCare-AI-v2.0.0.aab`**: Official Android App Bundle formatted for Google Play Console publication.

            ### 📋 Key Features:
            - **Kannada First:** Intuitive interface in Kannada (default), English, and Hindi.
            - **Real AI Inference:** Quantum-Classical CNN Hybrid with 20 rice conditions.
            - **CIBRC Verified Pesticide Safety:** Active ingredients, dosage, PHI, REI, and non-chemical cultural care.
            - **Zero Reinstall Updates:** Remote content, announcements, and disease advisories update dynamically.
            - **Resilient Offline Architecture:** Offline cached disease guides, history, and photo queue.
