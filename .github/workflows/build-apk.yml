name: Build Android APK & Release Bundle

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-android:
    name: Build APK and AAB
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend-react/package-lock.json

      - name: Build Web Bundle & Sync Android Assets
        run: |
          cd frontend-react
          npm ci
          npm run build
          npx cap sync android

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x frontend-react/android/gradlew

      - name: Build Android Debug APK
        run: |
          cd frontend-react/android
          ./gradlew assembleDebug --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RiceCare-AI-v2.0.0-APK
          path: frontend-react/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Create GitHub Release (on tag or manual trigger)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: frontend-react/android/app/build/outputs/apk/debug/app-debug.apk
          name: RiceCare AI Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
