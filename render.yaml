services:
  - type: web
    name: ricecare-ai
    env: docker
    plan: free
    region: oregon
    dockerfilePath: Dockerfile
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 8000
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_API_KEY
        value: ricecare_admin_secure_key_2026
      - key: ALLOWED_ORIGINS
        value: "*"
